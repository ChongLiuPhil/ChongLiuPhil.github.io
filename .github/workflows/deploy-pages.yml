name: Deploy academic homepage to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "project.infrastructure.json"
      - "docs/CLOUDFLARE_ROLLOUT_PLAN.md"
      - ".github/workflows/cloudflare-plan-check.yml"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "project.infrastructure.json"
      - "docs/CLOUDFLARE_ROLLOUT_PLAN.md"
      - ".github/workflows/cloudflare-plan-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lint and production build
        run: npm run check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
