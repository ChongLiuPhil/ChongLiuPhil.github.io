harc_site:
  profile: "HARC-compatible public website project"
  version: "0.2"
  repository_role: "public-academic-homepage"
  authoritative_store: "github"
  default_branch: "main"

  upstream_harc:
    repository: "ChongLiuPhil/Human-AI-Research-Collaboration-Protocol"
    protocol_version: "0.2.0-draft"
    reviewed_commit: "4b881ab6fcc4f2fcf981cd7179cbe2fb6b2b1d93"
    inheritance: "review-before-adopt"
    automatic_rule_inheritance: false

  language:
    documentation_canonical: "zh-CN"
    documentation_mirror: "en"
    site_content_model: "paired-atomic-bilingual"
    rule: "For substantive public-facing content changes, update zh and en together in the same work cycle."

  public_boundary:
    repository_is_public: true
    private_sources_may_be_consulted: true
    private_material_may_be_copied_automatically: false
    explicit_publication_approval_required: true
    private_coordination_repository: "ChongLiuPhil/academic-vault"

  source_of_truth:
    public_content: "app/content.ts"
    presentation: "app/page.tsx"
    site_metadata: "app/layout.tsx"
    styles: "app/globals.css"
    content_validation: "scripts/validate-content.mjs"
    deployment: ".github/workflows/deploy-pages.yml"
    agent_contract:
      canonical: "AGENTS.zh-CN.md"
      mirror: "AGENTS.md"
    collaboration_protocol:
      canonical: "docs/COLLABORATION_PROTOCOL.zh-CN.md"
      mirror: "docs/COLLABORATION_PROTOCOL.md"

  required_read_order:
    - "HARC_SITE_MANIFEST.yaml"
    - "AGENTS.zh-CN.md"
    - "docs/COLLABORATION_PROTOCOL.zh-CN.md"
    - "README.zh-CN.md"
    - "app/content.ts"
    - "app/layout.tsx"
    - "package.json"
    - ".github/workflows/deploy-pages.yml"

  revision_policy:
    read_latest_before_high_impact_action: true
    read_latest_before_write: true
    stale_after_write: true
    invalidate_touched_cache_after_write: true
    conflict_state: "REVISION-CONFLICT"

  invariants:
    - "Anything committed to this repository is public."
    - "Private research material is never staged here."
    - "Public content changes require explicit publication intent."
    - "Bilingual public-facing content changes are atomic."
    - "Stable IDs in app/content.ts must be preserved unless a migration is deliberate."
    - "Public SEO and structured metadata should derive from app/content.ts where practical."
    - "Run npm run check before treating a structural or content change as complete."
    - "High-impact changes should use a branch and pull request."
    - "Session copies are non-authoritative caches; GitHub repository state outranks chat memory."
